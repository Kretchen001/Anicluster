<?xml version="1.0" encoding="UTF-8"?>
<!--
  Anicluster-Icon. Eigene Gestaltung für dieses Projekt, gemeinfrei (CC0 1.0, https://creativecommons.org/publicdomain/zero/1.0/).
  Idee: ein Netzwerk aus Knoten (wie das Tag-Netzwerk der Anwendung) mit einem Funkeln im Zentrum.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D63F0"/>
      <stop offset="1" stop-color="#3A2FB8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Hintergrund: abgerundetes Quadrat -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="262" r="230" fill="url(#glow)"/>

  <!-- Verbindungen -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none">
    <g stroke-width="14" stroke-opacity="0.9">
      <line x1="256" y1="262" x2="142" y2="142"/>
      <line x1="256" y1="262" x2="376" y2="130"/>
      <line x1="256" y1="262" x2="410" y2="300"/>
      <line x1="256" y1="262" x2="304" y2="410"/>
      <line x1="256" y1="262" x2="112" y2="336"/>
    </g>
    <g stroke-width="8" stroke-opacity="0.45">
      <line x1="142" y1="142" x2="376" y2="130"/>
      <line x1="376" y1="130" x2="410" y2="300"/>
      <line x1="304" y1="410" x2="112" y2="336"/>
      <line x1="112" y1="336" x2="142" y2="142"/>
    </g>
  </g>

  <!-- Satelliten-Knoten -->
  <circle cx="142" cy="142" r="36" fill="#FFFFFF"/>
  <circle cx="376" cy="130" r="28" fill="#FFFFFF"/>
  <circle cx="410" cy="300" r="40" fill="#FFFFFF"/>
  <circle cx="304" cy="410" r="30" fill="#FFC94D"/>
  <circle cx="112" cy="336" r="32" fill="#FFFFFF"/>

  <!-- Zentraler Knoten mit Funkeln -->
  <circle cx="256" cy="262" r="72" fill="#FFFFFF"/>
  <path d="M256 208 Q262 256 310 262 Q262 268 256 316 Q250 268 202 262 Q250 256 256 208 Z" fill="#4F46E5"/>
</svg>
